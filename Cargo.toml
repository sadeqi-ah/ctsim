[package]
name = "ctsim"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Slot-based simulator for consensus over concurrent transmissions (CI/CE) in low-power wireless networks"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sadeqi-ah/ctsim"
keywords = ["simulation", "consensus", "wireless", "networking", "research"]
categories = ["simulation", "science"]

[dependencies]
indicatif = "0.18.6"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8"

[profile.release]
# Figure scripts run thousands of sweep cells; this is the profile the paper used.
opt-level = 3

[dev-dependencies]
sha1_smol = "1.0"
