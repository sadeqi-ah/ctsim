name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

      - name: Smoke-run every example config
        run: |
          for cfg in examples/*.toml; do
            echo "== $cfg"
            ./target/release/ctsim "$cfg"
          done

      # A fixed seed must give the same graph in a fresh process. Rust randomizes
      # HashSet iteration order per process, so an order-dependent bug can pass
      # inside one `cargo test` run and still break reproducibility across runs.
      - name: Reproducibility holds across separate processes
        run: |
          for i in 1 2 3; do
            cargo test --release --test reproducibility
          done

      - name: Sweeps are reproducible across separate processes
        run: |
          ./target/release/ctsim sweep_topology.toml
          mv plots/topology/results/sweep_summary.csv /tmp/topology_a.csv
          rm -rf plots/topology/results
          ./target/release/ctsim sweep_topology.toml
          diff /tmp/topology_a.csv plots/topology/results/sweep_summary.csv \
            || { echo "sweep output differs between runs of the same seed"; exit 1; }

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Addition 15 README and row provenance check
        run: python3 docs/validation/addition15/scripts/analyze_n_sweep.py --check

      # The scalability sweep includes N=188 and takes minutes; the fast scripts
      # are enough to prove the figure pipeline still runs end to end.
      - name: Generate the single-run figures
        run: python3 tools/regen_figures.py --only progress energy duty_cycle

      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            plots/**/*.png
            plots/**/*.csv
            MANIFEST.sha256
